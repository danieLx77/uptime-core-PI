name: CI da API

on:
  push:
    branches: [main, desafio-01]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Geração, lint e testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: uptime_test
          POSTGRES_PASSWORD: uptime_test
          POSTGRES_DB: uptime_ci_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U uptime_test -d uptime_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      HUSKY: '0'
      JWT_SECRET: uptime-ci-test-signing-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client e Swagger
        run: |
          npm exec -- prisma generate
          npm run swagger
          test -s src/config/swagger-output.json

      - name: Executar lint
        run: npm run lint

      - name: Aplicar migrations e executar testes com cobertura
        env:
          DATABASE_URL: postgresql://uptime_test:uptime_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/uptime_ci_test?schema=public
        run: |
          npm run db:migrate
          npm test -- --coverage
