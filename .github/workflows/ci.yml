name: CI da API

on:
  push:
    branches: [main, desafio-03]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Serviços, contratos e persistência
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      core-db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_core
          POSTGRES_PASSWORD: test_core
          POSTGRES_DB: uptime_core_test
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test_core -d uptime_core_test"
          --health-interval 3s --health-timeout 5s --health-retries 15
      incidents-db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_incidents
          POSTGRES_PASSWORD: test_incidents
          POSTGRES_DB: uptime_incidents_test
        ports: [5432/tcp]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test_incidents -d uptime_incidents_test"
          --health-interval 3s --health-timeout 5s --health-retries 15
    env:
      HUSKY: '0'
      JWT_SECRET: chave-jwt-exclusiva-do-teste
      INTERNAL_SERVICE_TOKEN: credencial-entre-servicos-de-teste
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Configurar bancos temporários
        run: |
          echo 'CORE_DATABASE_URL=postgresql://test_core:test_core@127.0.0.1:${{ job.services.core-db.ports[5432] }}/uptime_core_test' >> "$GITHUB_ENV"
          echo 'INCIDENTS_DATABASE_URL=postgresql://test_incidents:test_incidents@127.0.0.1:${{ job.services.incidents-db.ports[5432] }}/uptime_incidents_test' >> "$GITHUB_ENV"
      - name: Validar schemas e gerar clientes separados
        run: |
          npm run db:validate
          npm run db:generate
      - name: Lint, fronteiras e contratos
        run: |
          npm run lint
          npm run test:architecture
          npm run test:contracts
          python3 -m venv "$RUNNER_TEMP/openapi"
          "$RUNNER_TEMP/openapi/bin/python" -m pip install 'openapi-spec-validator==0.7.2'
          "$RUNNER_TEMP/openapi/bin/python" -m openapi_spec_validator services/core/openapi/openapi.json services/incidents/openapi/openapi.json
      - name: Migrar bancos e executar testes com cobertura
        run: |
          npm run db:migrate
          npm test -- --coverage
  compose:
    name: Builds independentes e smoke do Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: chave-jwt-exclusiva-do-compose-ci
      INTERNAL_SERVICE_TOKEN: credencial-interna-exclusiva-do-compose-ci
      COMPOSE_PROJECT_NAME: uptime_d3_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar Compose e construir as imagens
        run: |
          docker compose config --quiet
          docker compose build core
          docker compose build incidents
          docker compose build gateway
      - name: Iniciar serviços separadamente e validar Gateway
        run: |
          docker compose up -d --wait core
          docker compose stop core
          docker compose up -d --wait incidents
          docker compose up -d --wait core gateway
          node scripts/smoke-compose.mjs
          docker compose restart incidents
          docker compose up -d --wait incidents
          node scripts/smoke-compose.mjs
      - name: Limpar o ambiente exclusivo da CI
        if: always()
        run: |
          docker compose logs --tail 35
          docker compose down --volumes
