services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    environment:
      CORE_URL: http://core:3001
      INCIDENTS_URL: http://incidents:3002
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    networks: [edge]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/gateway/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 12

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    command: [sh, -c, "npm run db:migrate -w @uptime/core && exec node services/core/src/server.js"]
    environment:
      PORT: 3001
      CORE_DATABASE_URL: postgresql://${CORE_DB_USER:-uptime_core}:${CORE_DB_PASSWORD:-uptime_core_local}@core-db:5432/uptime_core
      INCIDENTS_URL: http://incidents:3002
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Defina INTERNAL_SERVICE_TOKEN no .env}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
    depends_on:
      core-db:
        condition: service_healthy
    networks: [edge, core-data]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20

  incidents:
    build:
      context: .
      dockerfile: services/incidents/Dockerfile
    command: [sh, -c, "npm run db:migrate -w @uptime/incidents && exec node services/incidents/src/server.js"]
    environment:
      PORT: 3002
      INCIDENTS_DATABASE_URL: postgresql://${INCIDENTS_DB_USER:-uptime_incidents}:${INCIDENTS_DB_PASSWORD:-uptime_incidents_local}@incidents-db:5432/uptime_incidents
      CORE_URL: http://core:3001
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Defina INTERNAL_SERVICE_TOKEN no .env}
    depends_on:
      incidents-db:
        condition: service_healthy
    networks: [edge, incidents-data]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 20

  core-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: uptime_core
      POSTGRES_USER: ${CORE_DB_USER:-uptime_core}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-uptime_core_local}
    volumes:
      - core-data:/var/lib/postgresql/data
    networks: [core-data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 2s
      retries: 15

  incidents-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: uptime_incidents
      POSTGRES_USER: ${INCIDENTS_DB_USER:-uptime_incidents}
      POSTGRES_PASSWORD: ${INCIDENTS_DB_PASSWORD:-uptime_incidents_local}
    volumes:
      - incidents-data:/var/lib/postgresql/data
    networks: [incidents-data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 2s
      retries: 15

networks:
  edge:
  core-data:
    internal: true
  incidents-data:
    internal: true

volumes:
  core-data:
  incidents-data:
